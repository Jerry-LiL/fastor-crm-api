version: '3.8'

services:
  db:
    image: postgres:16
    container_name: fastor_crm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastor_crm
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fastor_crm_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/fastor_crm
      JWT_SECRET: supersecretjwtkeychangeinproduction
      JWT_EXPIRES_IN: 1d

volumes:
  pgdata:
